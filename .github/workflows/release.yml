# Builds the desktop app for macOS (Apple silicon and Intel) and Linux
# (x64 and arm64) when a version tag is pushed, and attaches them to that
# tag's GitHub release, where install.sh picks them up:
#
#   git tag v1.0.0 && git push origin v1.0.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: npx --yes @tauri-apps/cli@2
          args: --target ${{ matrix.target }}
          tagName: ${{ github.ref_name }}
          releaseName: Steam Auto Unlocker ${{ github.ref_name }}
          releaseBody: |
            Install or update on macOS or Linux:

            ```sh
            curl -fsSL https://raw.githubusercontent.com/sepehrsardooeinasab/steam-auto-unlocker/main/install.sh | sh
            ```

            The files below are what that command installs. Downloading the macOS app by hand instead means macOS asks you to allow it once in System Settings > Privacy & Security.
          releaseDraft: false
