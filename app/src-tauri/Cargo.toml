[package]
name = "star"
version = "3.0.8"
description = "Desktop window for STAR (Steam Timed Achievement Replayer)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde_json = "1"

# Placing the window buttons in the page's top bar (see main.rs). These are
# already part of the build through Tauri.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSResponder", "NSRunningApplication", "NSView", "NSWindow"] }
# Asking before a logout or shutdown while a game runs (see background.rs).
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSString"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
