[package]
name = "steam-auto-unlocker"
version = "3.0.2"
description = "Desktop window for Steam Auto Unlocker"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

# Placing the window buttons in the page's top bar (see main.rs). Already
# part of the build through Tauri.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
